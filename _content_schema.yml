# _content_schema.yml
wellness:
  sections:
    type: list
    label: Sections
    fields:
      title:
        type: string
        label: Section Title
      description:
        type: markdown
        label: Description
      style:
        type: select
        label: Background Colour
        options:
          - label: Cream
            value: cream
          - label: White
            value: white
      images:
        type: list
        label: Images
        fields:
          - type: image
            label: Upload Image
